name: Data Contamination Check

on:
  push:
    branches: [main]
    paths:
      - "data/**"
  pull_request:
    branches: [main]
    paths:
      - "data/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Check contamination
        run: uv run python scripts/check_contamination.py --train-glob "data/**/train*.jsonl" --eval-glob "data/benchmarks/**/probes*.jsonl"
