# Proper-scale SFT run (task #43 of the "train properly" pass): same base model/LoRA
# hyperparameters as the v0 Day-4 run, but on the 2017-example v1 dataset (10x v0's 202
# train examples) and the doc's actually-recommended batch size (per_device=8, grad_accum=4)
# since the dataset is now large enough to support it, plus 2 epochs per the roadmap.
base_model: "google/gemma-4-E2B-it"
base_model_revision: "3e22461f65e89153144f8adb70e3b8c2cc9845a7"
train_file: "data/sft/v1/train.jsonl"
val_file: "data/sft/v1/val.jsonl"
output_dir: "outputs/sft/v1"
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: "all-linear"
learning_rate: 1e-4
lr_scheduler_type: "cosine"
warmup_ratio: 0.03
num_train_epochs: 2.0
max_seq_length: 2048
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
bf16: true
packing: false
neftune_noise_alpha: null
seed: 1337
report_to: "none"
run_name: null
